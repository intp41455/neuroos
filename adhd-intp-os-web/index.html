<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf6f1">
<title>NeuroOS · 桌面暖系版</title>
<style>
:root{
  --bg:#faf6f1; --bg2:#f5efe8; --card:#fffdfa; --line:#e8e0d6;
  --text:#4a3f35; --muted:#9a8e7e; --pri:#d98c5f; --pri2:#e8a87c;
  --ok:#8fb88e; --warn:#e8c36d; --danger:#e08e8e; --info:#7eb8c9;
  --net:#c9a86c; --net2:#b08d4f; --tree:#d98c5f; --tree2:#c0784d; --linec:#8fb88e; --line2:#76a075;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overscroll-behavior:none}
body{display:flex;flex-direction:column;margin:0;padding:0;min-height:100vh}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}

.app-shell{display:flex;flex:1;min-height:100vh}
.sidebar{display:none;flex-direction:column;width:230px;background:var(--card);border-right:1px solid var(--line);padding:20px 0;position:fixed;left:0;top:0;bottom:0;z-index:50}
.sidebar .brand{padding:0 20px 24px;font-size:20px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
.sidebar nav{display:flex;flex-direction:column;gap:4px;padding:0 12px}
.sidebar nav button{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);text-align:left}
.sidebar nav button.on{background:#FDF2EC;color:#993C1D;font-weight:600}
.sidebar nav button .ic{font-size:18px;line-height:1}
.sidebar .side-foot{margin-top:auto;padding:16px 20px 0;font-size:12px;color:var(--muted)}

.main-area{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(250,246,241,.92);backdrop-filter:blur(10px);z-index:40;border-bottom:1px solid var(--line)}
h1{font-size:20px;font-weight:500;letter-spacing:-.2px}
.top-actions{display:flex;gap:8px;align-items:center}
.pill{font-size:12px;padding:6px 14px;border-radius:99px;background:var(--card);color:var(--muted);border:1px solid var(--line);font-weight:600}

.tabbar{position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:rgba(250,246,241,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:40}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);font-weight:500}
.tabbar button.on{color:var(--pri);font-weight:700}
.tabbar .ic{font-size:18px;line-height:1}

main{flex:1;overflow-y:auto;padding:0 16px 100px}
.view{display:none}
.view.on{display:block}

@media(min-width:900px){
.sidebar{display:flex}
.main-area{margin-left:230px}
.tabbar{display:none}
main{padding:0 24px 24px}
.topbar{padding:14px 24px}
}

@media(min-width:1200px){
main{padding:0 32px 32px}
}

/* Quest desktop layout */
.quest-layout{display:flex;flex-direction:column;gap:12px}
.quest-list{flex:1}
.quest-detail{display:none;flex:1}
.quest-layout.has-open .quest-list{display:none}
.quest-layout.has-open .quest-detail{display:block}

@media(min-width:900px){
.quest-layout{flex-direction:row;align-items:flex-start;gap:20px}
.quest-list{width:360px;flex-shrink:0;max-height:calc(100vh - 120px);overflow-y:auto;padding-right:8px;display:block !important}
.quest-detail{flex:1;max-height:calc(100vh - 120px);overflow-y:auto;padding-right:8px;display:block !important}
.quest-layout.has-open .quest-list{display:block !important}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(74,63,53,.04)}
.card.hoverable{transition:transform .15s,box-shadow .15s}
.card.hoverable:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(74,63,53,.08)}
.mobile-only{display:inline-block}
.desktop-only{display:none}
@media(min-width:900px){
.mobile-only{display:none !important}
.desktop-only{display:inline-flex !important}
}

.grid-2{display:grid;grid-template-columns:1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr;gap:12px}

@media(min-width:900px){
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
}

@media(min-width:1200px){
.grid-3{grid-template-columns:repeat(3,1fr)}
}
.card.net{border-left:4px solid var(--net)}
.card.tree{border-left:4px solid var(--tree)}
.card.linec{border-left:4px solid var(--linec)}
.card-title{font-size:15px;font-weight:700;margin-bottom:6px}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.tiny{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}

input,textarea,select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:16px;outline:none;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
input:focus,textarea:focus,select:focus{border-color:var(--pri2);background:var(--card)}
input:disabled,textarea:disabled,select:disabled{opacity:.5;background:var(--bg)}
textarea{min-height:90px;resize:vertical}

.btn{padding:10px 14px;border-radius:12px;background:var(--bg2);color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn.pri{background:var(--pri);color:#fff;box-shadow:0 3px 10px rgba(217,140,95,.2)}
.btn.ok{background:var(--ok);color:#fff}
.btn.warn{background:var(--warn);color:#4a3f35}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.block{display:block;width:100%;text-align:center;margin:6px 0}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.xs{padding:4px 8px;font-size:11px;border-radius:7px}
.btn.big{padding:14px 18px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn{transition:filter .12s,transform .12s,background .12s}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.97)}
.btn.pri:hover{filter:brightness(1.05)}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* Onboarding */
.onboarding{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;justify-content:center;padding:30px;text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:900px){
.onboarding{position:static;z-index:auto;padding:40px 0;background:transparent;overflow:visible}
.onboarding-box{max-width:600px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:40px;box-shadow:0 8px 32px rgba(74,63,53,.06)}
}
.onboarding h2{font-size:22px;font-weight:800;margin-bottom:12px}
.onboarding p{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.7}
.onboarding input{font-size:17px;padding:16px;text-align:center;margin-bottom:14px}

/* Today */
.phase-big{text-align:center;padding:22px 18px 18px;background:linear-gradient(180deg,rgba(217,140,95,.08),transparent);border-radius:var(--r);margin-bottom:12px}
.phase-big .emoji{font-size:40px;margin-bottom:6px}
.phase-big .name{font-size:20px;font-weight:800;margin-bottom:4px}
.phase-big .desc{font-size:13px;color:var(--muted)}
.rhythm-bar{display:flex;height:32px;border-radius:10px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);margin:12px 0}
.rhythm-bar div{display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden}
.rhythm-bar .sleep{background:#e8e0d6}
.rhythm-bar .calm{background:#f0e6d8}
.rhythm-bar .deep{background:#e8d5c4;color:var(--text)}
.rhythm-bar .creative{background:#f5e6c8}
.rhythm-bar .wind{background:#e8d8d8}

.rec-box{background:var(--pri);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px;text-align:center;box-shadow:0 4px 16px rgba(217,140,95,.18)}
.rec-box .label{font-size:11px;opacity:.9;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.rec-box .title{font-size:18px;font-weight:700;margin-bottom:14px}
.rec-box .btn{background:#fff;color:var(--pri);border:none}

.today-list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.today-list .item:last-child{border-bottom:none}
.today-list .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;flex-shrink:0}
.today-list .item.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.today-list .item.done .text{text-decoration:line-through;color:var(--muted)}
.today-list .text{flex:1;font-size:14px}
.today-list .from{font-size:11px;color:var(--muted)}

/* Single step */
.single-step{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center}
.single-step .label{font-size:12px;color:var(--muted);margin-bottom:14px}
.single-step .task{font-size:24px;font-weight:800;margin-bottom:12px;max-width:440px;line-height:1.35}
.single-step .meta{color:var(--muted);margin-bottom:36px}
.single-step .actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}

/* Quest list */
.quest-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.quest-item .title{font-size:15px;font-weight:700;margin-bottom:4px}
.quest-item .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
.quest-item .progress{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:10px}
.quest-item .progress i{display:block;height:100%;background:var(--pri);border-radius:99px}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.badge.net{background:rgba(201,168,108,.12);color:var(--net2);border-color:transparent}
.badge.tree{background:rgba(217,140,95,.12);color:var(--tree2);border-color:transparent}
.badge.linec{background:rgba(143,184,142,.12);color:var(--line2);border-color:transparent}

/* Quest detail */
.workspace-tabs{display:flex;gap:8px;margin-bottom:12px}
.workspace-tabs .btn{flex:1}
.workspace-tabs .btn.on{background:var(--pri);color:#fff}

/* Net - infinite canvas */
.net-viewport{position:relative;width:100%;height:320px;background:var(--bg2);border:1px dashed var(--line);border-radius:var(--r);overflow:hidden;touch-action:none}
.net-canvas{position:absolute;width:4000px;height:4000px;left:0;top:0;transform-origin:0 0;background:linear-gradient(rgba(200,190,180,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(200,190,180,.06) 1px,transparent 1px);background-size:50px 50px}
.net-node{position:absolute;padding:7px 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;cursor:grab;user-select:none;white-space:nowrap;z-index:2;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.net-node.selected{box-shadow:0 0 0 2px var(--net);border-color:var(--net)}
.net-node.highlighted{background:#fff3e0;border-color:#ff9800;box-shadow:0 0 0 2px rgba(255,152,0,.3)}
.net-edge{position:absolute;height:2px;background:var(--muted);transform-origin:left center;z-index:1;pointer-events:none;opacity:.4}
.net-viewport .hint{position:absolute;bottom:6px;left:6px;color:var(--muted);font-size:10px;background:var(--bg);padding:3px 7px;border-radius:6px;z-index:10}
.net-controls{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:10}
.net-controls .btn{padding:5px 10px;font-size:11px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.net-counter{position:absolute;top:8px;left:8px;font-size:11px;color:var(--muted);background:var(--card);padding:3px 8px;border-radius:6px;border:1px solid var(--line);z-index:10}
.net-table{margin-top:10px;max-height:200px;overflow-y:auto}
.net-table table{width:100%;border-collapse:collapse;font-size:12px}
.net-table th,.net-table td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line)}
.net-table th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase}
.net-table tr:hover{background:var(--bg2)}
.net-table .idx{color:var(--muted);font-size:10px;width:30px}
.net-table .hl-mark{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--net);margin-right:4px}

/* Tree */
.tree-root{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.tree-root h4{margin:0 0 8px;font-size:12px;font-weight:700}
.tree-item{padding:7px 8px;border-radius:8px;background:var(--card);margin-bottom:5px;font-size:13px;display:flex;gap:7px;align-items:center}
.tree-item .handle{color:var(--muted);cursor:grab}

/* Line - 层级执行 */
.line-step{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid transparent;margin-bottom:6px;transition:border-color .15s,background .15s}
.line-step:hover{border-color:var(--line)}
.line-step.done{opacity:.55}
.line-step .chk{width:20px;height:20px;min-width:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;cursor:pointer;transition:all .15s}
.line-step .chk:hover{border-color:var(--ok)}
.line-step .chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.line-step .fold-btn{width:22px;height:22px;min-width:22px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);cursor:pointer;flex-shrink:0;transition:all .15s;user-select:none}
.line-step .fold-btn:hover{border-color:var(--pri2);color:var(--pri);background:#fffaf6}
.line-step .fold-btn .cnt{font-size:9px;margin-left:1px}
.line-step .fold-spacer{width:22px;min-width:22px;height:22px;flex-shrink:0}
.line-children{margin-left:14px;border-left:2px solid var(--line);padding-left:10px;margin-top:4px}
.line-children[hidden]{display:none}
.line-branch{position:absolute;left:-10px;top:16px;width:8px;height:2px;background:var(--line)}
.line-step{position:relative}
.line-step.depth-0>.line-branch{display:none}
.line-empty-hint{font-size:12px;color:var(--muted);padding:6px 2px 8px}
.line-fold-all{display:flex;gap:5px}

/* Sticky notes board */
.sticky-board{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:900px){.sticky-board{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1300px){.sticky-board{grid-template-columns:repeat(4,1fr)}}
.sticky-col{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:150px;display:flex;flex-direction:column}
.sticky-col.p1{border-top:3px solid #e08e8e}
.sticky-col.p2{border-top:3px solid #e8c36d}
.sticky-col.p3{border-top:3px solid #7eb8c9}
.sticky-col.p4{border-top:3px solid #b4b2a9}
.sticky-col .col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sticky-col .col-title{font-size:13px;font-weight:700}
.sticky-col .col-sub{font-size:11px;color:var(--muted);margin-bottom:10px}
.sticky-col .col-body{flex:1}
.sticky{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px;line-height:1.55;cursor:grab;transition:transform .12s,box-shadow .12s,border-color .12s}
.sticky:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(74,63,53,.07);border-color:var(--pri2)}
.sticky.dragging{opacity:.45;cursor:grabbing}
.sticky-col.dragover{background:#f7f0e8;border-color:var(--pri2)}
.sticky .acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.sticky .acts .btn{margin:0}
.sticky-add{display:flex;gap:6px;margin-top:8px}
.sticky-add input{font-size:13px;padding:9px 11px;border-radius:10px}
.sticky-empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 0;border:1px dashed var(--line);border-radius:10px}

/* 便利贴转线/网/树 选择器 */
.convert-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.convert-opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);cursor:pointer;transition:all .15s}
.convert-opt:hover{border-color:var(--pri2);background:#fffaf6}
.convert-opt .ico{font-size:20px}
.convert-opt .t{font-size:14px;font-weight:600}
.convert-opt .d{font-size:11px;color:var(--muted)}

/* Modal / Sheet */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;-webkit-overflow-scrolling:touch}
.modal-bg{position:absolute;inset:0;background:rgba(74,63,53,.5)}
.modal-sheet{position:relative;background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateZ(0)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--card);padding:11px 18px;border-radius:12px;border:1px solid var(--line);z-index:120;opacity:0;transition:.25s;box-shadow:0 4px 16px rgba(74,63,53,.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{text-align:center;padding:40px 18px;color:var(--muted)}
.empty .big{font-size:44px;display:block;margin-bottom:10px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.stat-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.stat-box .num{font-size:26px;font-weight:800;color:var(--pri)}
.stat-box .label{font-size:11px;color:var(--muted);margin-top:3px}

.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:none}

.bar-chart{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px}
.bar-chart div{flex:1;background:var(--pri2);border-radius:5px 5px 0 0;min-height:4px;position:relative}
.bar-chart div span{position:absolute;top:-14px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}

.probe-box{border:1px dashed var(--line);border-radius:12px;padding:10px;background:var(--bg2);margin-top:8px}

::-webkit-scrollbar{width:0;height:0}

/* ===== 便利贴看板 ===== */
.notes-board{display:grid;grid-template-columns:1fr;gap:14px;padding-top:4px}
@media(min-width:760px){ .notes-board{grid-template-columns:repeat(2,1fr)} }
@media(min-width:1100px){ .notes-board{grid-template-columns:repeat(4,1fr)} }
.note-col{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;min-height:140px}
.note-col-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:2px}
.note-col-head .dot{width:10px;height:10px;border-radius:50%;background:var(--zc);flex-shrink:0}
.note-col-head .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.note-tip{margin-bottom:8px}
.note-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.note-empty{font-size:13px;color:var(--muted);text-align:center;padding:14px 0;opacity:.6}
.note-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--zc);border-radius:12px;padding:10px 11px;box-shadow:0 3px 10px rgba(74,63,53,.05);transition:transform .12s,box-shadow .12s;cursor:grab}
.note-card:active{cursor:grabbing}
.note-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(74,63,53,.1)}

<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">🧠 NeuroOS</div>
    <nav>
      <button data-tab="now" class="on"><span class="ic">☀️</span>今天</button>
      <button data-tab="quests"><span class="ic">📋</span>任务</button>
      <button data-tab="capture"><span class="ic">📝</span>记录</button>

  <button data-tab="now" class="on"><span class="ic">☀️</span>今天</button>
  <button data-tab="quests"><span class="ic">📋</span>任务</button>
      <button data-tab="capture"><span class="ic">📝</span>记录</button>
      <button data-tab="notes"><span class="ic">🗒️</span>便利贴</button>
      <button data-tab="me"><span class="ic">⚙️</span>我的</button>
    </nav>

<div id="modal"></div>
<div id="toast" class="toast"></div>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){ r.unregister(); });
  }).catch(function(){});
}

const KEY='neuroos-v1';
const uid=function(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); };
const DAY=864e5;
const todayKey=function(){ return new Date().toLocaleDateString('sv'); };
let S,TAB='now',singleStep=null,openQuest=null,selectedNetNodes=[];

const TEMPLATES={
  write:{label:'写作',steps:[['定一句话核心观点',5],['列3个支撑点',10],['写最烂的第一稿',20],['改一遍',15],['定标题收尾',10]]},
  research:{label:'研究',steps:[['明确一个问题',5],['找2个可靠来源',15],['摘录关键信息',15],['整理成一句话结论',10],['标出还不确定的点',10]]},
  learn:{label:'学习',steps:[['看目录/框架',5],['快速扫读一遍',15],['记录3个新概念',15],['用自己的话复述',15],['做一道练习/应用',15]]},
  plan:{label:'策划',steps:[['定目标和Deadline',5],['列必须出现的元素',10],['排优先级',10],['做出最小可行版',20],['检查遗漏',10]]},
  talk:{label:'沟通',steps:[['想清要对方做什么',5],['写3条要点',10],['开场说结论',10],['补充必要背景',10],['确认下一步',5]]},
  tidy:{label:'整理',steps:[['分类成3堆',10],['快速决定第一批',15],['处理第二批',15],['收尾归位',10],['拍照/记录',5]]},
  dev:{label:'开发',steps:[['拆出一个最小功能点',10],['写伪代码/流程',10],['实现核心逻辑',25],['自测一遍',15],['提交/备份',5]]},
  habit:{label:'习惯',steps:[['穿上鞋/准备好',3],['做5分钟',5],['再5分钟',5],['记录完成',2],['奖励自己',5]]},
  default:{label:'通用',steps:[['想清楚最终成果',5],['拆成3小步',10],['先做第一步',15],['继续下一步',15],['收尾',10]]}
};

const DRAWERS=[
  {id:'problem',name:'问题/痛点',color:'#e08e8e'},
  {id:'hypothesis',name:'假设/洞察',color:'#e8c36d'},
  {id:'solution',name:'方案/资源',color:'#7eb8c9'},
  {id:'conclusion',name:'结论/输出',color:'#b8a0c9'},
  {id:'action',name:'行动/下一步',color:'#8fb88e'}
];

const NOTE_ZONES=[
  {id:'ei',name:'重要且紧急',color:'#e08e8e',tip:'马上做'},
  {id:'im',name:'重要不紧急',color:'#e8c36d',tip:'排期做'},
  {id:'ur',name:'紧急不重要',color:'#7eb8c9',tip:'可交办'},
  {id:'lt',name:'待定 / 搁置',color:'#b8a0c9',tip:'有空再看'}
];
function noteZone(id){ return NOTE_ZONES.find(function(z){ return z.id===id; })||NOTE_ZONES[3]; }

function classify(t){
  const s=t.toLowerCase();
  if(/写|文章|报告|总结|文案|论文|稿/.test(s)) return 'write';
  if(/查|研究|调研|资料|文献|分析/.test(s)) return 'research';
  if(/学|课|书|教程|知识/.test(s)) return 'learn';
  if(/策划|活动|会议|项目|方案|旅行|派对/.test(s)) return 'plan';
  if(/沟通|谈|说|聊|打电话|邮件|反馈/.test(s)) return 'talk';
  if(/整理|收拾|归档|分类|清/.test(s)) return 'tidy';
  if(/代码|开发|程序|功能|bug|修复/.test(s)) return 'dev';
  if(/习惯|运动|冥想|阅读|早起|喝水/.test(s)) return 'habit';
  return 'default';
}

function newQuest(title){
  const type=classify(title);
  const q={
    id:uid(),title:title,type:type,
    status:'line',created:Date.now(),updated:Date.now(),
    today:false,done:false,
    net:{nodes:[],edges:[],nextX:50,nextY:60,viewOffset:{x:0,y:0}},
    tree:{drawers:DRAWERS.map(function(d){ return {id:d.id,name:d.name,color:d.color,items:[]}; })},
    line:[],
    probe:{hypothesis:'',success:'',stopLoss:'',days:7,active:false},
    context:{blocked:'',lastNote:'',lastAt:0},
    goodEnough:{mode:'100',sixty:'',hundred:''},
    distill:{scout:'',restructure:'',layers:[],verify:''}
  };
  const tmpl=TEMPLATES[type] || TEMPLATES.default;
  q.tree.drawers.find(function(d){ return d.id==='action'; }).items=tmpl.steps.map(function(s){ return {id:uid(),text:s[0]}; });
  q.line=tmpl.steps.map(function(s){ return {id:uid(),title:s[0],est:s[1],done:false,spent:0,today:false,created:Date.now()}; });
  return q;
}

function load(){
  try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; }
  if(!S || typeof S!=='object') S=sampleData();
  migrate(); cleanTrash();
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('保存失败'); } }
function migrate(){
  if(!S.settings) S.settings={wake:'09:00',start:'10:00',wind:'22:00',sleep:'00:30',theme:'warm',autoNext:true,morningBlock:true};
  if(!S.quests) S.quests=[];
  if(!S.parking) S.parking={insight:[],question:[],block:[],idea:[],quote:[]};
  if(!S.distills) S.distills=[];
  if(!S.log) S.log={sessions:[],completions:[]};
  if(!S.handoff) S.handoff={three:'',two:'',one:'',morning:'',date:''};
  if(!S.meta) S.meta={streak:0,lastDay:null,best:0};
  if(!S.trash) S.trash=[];
  if(!S.notes) S.notes=[];
  S.quests.forEach(function(q){
    if(!q.id) q.id=uid();
    if(!q.net) q.net={nodes:[],edges:[],nextX:50,nextY:60,viewOffset:{x:0,y:0}};
    if(q.net && typeof q.net.viewOffset==='undefined') q.net.viewOffset={x:0,y:0};
    if(!q.tree) q.tree={drawers:DRAWERS.map(function(d){ return {id:d.id,name:d.name,color:d.color,items:[]}; })};
    if(!q.line && q.steps) q.line=q.steps.map(function(s){ return {id:s.id||uid(),title:s.title,est:s.est||15,done:!!s.done,spent:s.spent||0,today:!!q.today,created:s.created||Date.now()}; });
    if(!q.line) q.line=[];
    if(!q.probe) q.probe={hypothesis:'',success:'',stopLoss:'',days:7,active:false};
    if(!q.context) q.context={blocked:'',lastNote:'',lastAt:0};
    if(!q.goodEnough) q.goodEnough={mode:'100',sixty:'',hundred:''};
    if(!q.distill) q.distill={scout:'',restructure:'',layers:[],verify:''};
  });
}
function sampleData(){
  const q=newQuest('示例：写一份季度总结');
  q.today=true;
  return {settings:{wake:'09:00',start:'10:00',wind:'22:00',sleep:'00:30',theme:'warm',autoNext:true,morningBlock:true},quests:[q],parking:{insight:[],question:[],block:[],idea:[],quote:[]},distills:[],log:{sessions:[],completions:[]},handoff:{three:'',two:'',one:'',morning:'',date:''},meta:{streak:0,lastDay:null,best:0},notes:[{id:uid(),text:'欢迎使用便利贴：按重要程度拖到不同区域，右键或点菜单可加入线/网/树',zone:'im',created:Date.now(),updated:Date.now()}]};
}

function parseHM(s){ const p=s.split(':'); return parseInt(p[0])*60+parseInt(p[1]); }
function currentPhase(){
  const now=new Date(); const min=now.getHours()*60+now.getMinutes();
  const w=parseHM(S.settings.wake), s=parseHM(S.settings.start), wd=parseHM(S.settings.wind), sl=parseHM(S.settings.sleep);
  if(sl<w){ if(min>=sl && min<w) return {key:'sleep',name:'睡眠期',emoji:'🌙',desc:'现在不是工作时间，好好休息'}; }
  else{ if(min>=sl || min<w) return {key:'sleep',name:'睡眠期',emoji:'🌙',desc:'现在不是工作时间，好好休息'}; }
  if(min>=w && min<s) return {key:'calibrate',name:'校准期',emoji:'🌅',desc:'低刺激启动，不要立刻处理复杂任务'};
  if(min>=s && min<wd) return {key:'deep',name:'深度期',emoji:'🌿',desc:'大脑在线，做最难的事'};
  return {key:'creative',name:'创意期',emoji:'🍵',desc:'适合发散、整理、收尾'};
}
function rhythmBlocks(){
  const w=parseHM(S.settings.wake), s=parseHM(S.settings.start), wd=parseHM(S.settings.wind), sl=parseHM(S.settings.sleep);
  const sleepStart=sl, sleepEnd=(sl+7.5*60)%1440;
  const creativeStart=Math.max(s,wd-120);
  const total=1440;
  return [
    {id:'sleep',start:sleepStart,end:Math.min(1440,sleepStart+7.5*60),label:'睡眠'},
    {id:'calm',start:w,end:s,label:'校准'},
    {id:'deep',start:s,end:creativeStart,label:'深度'},
    {id:'creative',start:creativeStart,end:wd,label:'创意'},
    {id:'wind',start:wd,end:wd+60,label:'断电'}
  ].filter(function(b){ return b.end>b.start; }).map(function(b){ return {...b,pct:(b.end-b.start)/total*100}; });
}
function nextPhaseTransition(){
  const now=new Date(); const m=now.getHours()*60+now.getMinutes();
  const blocks=rhythmBlocks();
  for(let i=0;i<blocks.length;i++){ if(m<blocks[i].end) return {phase:blocks[i],min:blocks[i].end-m}; }
  return {phase:blocks[0],min:blocks[0].end+(1440-m)};
}

function findQuest(id){ return S.quests.find(function(q){ return q.id===id; }); }
function allLineItems(q){ if(q) return collectAllLineItems(q.line).map(function(n){ return {n:n,q:q}; }); const a=[]; S.quests.forEach(function(q){ collectAllLineItems(q.line).forEach(function(n){ a.push({n:n,q:q}); }); }); return a; }
function nextLineItem(){
  const all=allLineItems();
  const pending=all.filter(function(x){ return !x.n.done; });
  if(!pending.length) return null;
  const today=pending.filter(function(x){ return x.n.today || x.q.today; });
  const use=today.length?today:pending;
  return use.sort(function(a,b){ return (a.n.est||99)-(b.n.est||99); })[0];
}
function progress(q){ const a=collectAllLineItems(q.line); if(!a.length) return 0; return Math.round(a.filter(function(s){ return s.done; }).length/a.length*100); }
function bumpStreak(){
  const t=todayKey();
  if(S.meta.lastDay!==t){
    const y=new Date(Date.now()-DAY).toLocaleDateString('sv');
    S.meta.streak=(S.meta.lastDay===y)?(S.meta.streak||0)+1:1;
    S.meta.lastDay=t; S.meta.best=Math.max(S.meta.best||0,S.meta.streak);
  }
}

function renderAll(){
  document.documentElement.dataset.theme=S.settings.theme==='dark'?'dark':'warm';
  document.getElementById('phase-pill').textContent=currentPhase().name;
  if(singleStep){ renderSingleStep(); return; }
  const hasToday=S.quests.some(function(q){ return q.today && q.line.some(function(n){ return !n.done; }); });
  if(!hasToday && TAB==='now' && !openQuest){ renderOnboarding(); return; }
  document.getElementById('modal').innerHTML='';
  document.querySelectorAll('.tabbar button').forEach(function(b){ b.classList.toggle('on',b.dataset.tab===TAB); });
  document.querySelectorAll('.sidebar nav button').forEach(function(b){ b.classList.toggle('on',b.dataset.tab===TAB); });
  const titles={now:'今天',quests:'任务仓库',capture:'记录 & 停车区',notes:'便利贴看板',me:'我的 & 设置'};
  const pt=document.getElementById('page-title'); if(pt) pt.textContent=titles[TAB]||'NeuroOS';
  document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on',v.id==='view-'+TAB); });
  const fn={now:vNow,quests:vQuests,capture:vCapture,notes:vNotes,me:vMe}[TAB];
  if(fn) fn();
}

function renderOnboarding(){
  const m=document.getElementById('modal');
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on'); });
  document.querySelectorAll('.tabbar button').forEach(function(b){ b.classList.remove('on'); });
  m.innerHTML='<div class="onboarding"><div class="onboarding-box"><div style="font-size:56px;margin-bottom:14px">🌱</div><h2>今天你最想完成的一件事是什么？</h2><p>不要想全部，只写一件。<br>写完我会帮你拆成小步。</p><input id="onboarding-input" placeholder="比如：写季度总结" autofocus><button class="btn pri block big" data-act="onboarding-add">开始拆解</button><div class="hint">也可以先去"任务"页列出所有想做的事</div></div></div>';
}

function vNow(){
  const phase=currentPhase();
  const tr=nextPhaseTransition();
  const next=nextLineItem();
  const items=allLineItems().filter(function(x){ return !x.n.done && (x.n.today || x.q.today); });
  let recHTML='';
  if(next){
    recHTML='<div class="rec-box"><div class="label">推荐你先做这一步</div><div class="title">'+esc(next.n.title)+'</div><div style="font-size:12px;opacity:.9;margin-bottom:14px">来自：'+esc(next.q.title)+(next.n.est?' · 预估 '+next.n.est+' 分钟':'')+'</div><button class="btn block big" data-act="start-single" data-id="'+next.n.id+'">开始只做这一步</button></div>';
  }
  const handoffDate=S.handoff.date;
  const hasMorning=handoffDate===todayKey() && S.handoff.morning;
  const leftCol=recHTML+(items.length?'<div class="card hoverable"><div class="card-title">今天待做</div><div class="today-list">'+items.map(function(x){ return '<div class="item" data-id="'+x.n.id+'"><div class="chk">✓</div><div class="text">'+esc(x.n.title)+'<div class="from">'+esc(x.q.title)+'</div></div></div>'; }).join('')+'</div></div>':'<div class="card empty hoverable"><span class="big">🍵</span>今天没有待做步骤了。</div>');
  const rightCol=(phase.key==='wind'?'<div class="card hoverable"><div class="card-title">🌙 该做睡前交接了</div><div class="card-sub">合上电脑前把明天"加载期"要用的东西写出去。</div><button class="btn block" data-act="open-handoff">填写交接</button></div>':'')+'<div class="card hoverable"><div class="card-title">'+(hasMorning?'🌅 今早交接条':'🌙 睡前交接')+'</div>'+(hasMorning?'<div style="font-size:15px;font-weight:600;margin-top:6px">'+esc(S.handoff.morning)+'</div>':'<div class="card-sub">3个重点 / 2个假设 / 1个明早第一步</div><button class="btn block" data-act="open-handoff">填写交接</button>')+'</div>'+(phase.key==='calm' && S.settings.morningBlock?'<div class="card hoverable"><div class="card-title">🌫 上午离线校准期</div><div class="card-sub">只做被动输入或机械性杂务，不要立刻输出。</div><div class="row"><button class="btn sm" data-act="morning-task">🎧 听资讯</button><button class="btn sm" data-act="morning-task">🧹 整理桌面</button><button class="btn sm" data-act="morning-task">☕ 做咖啡</button></div></div>':'');
  document.getElementById('view-now').innerHTML='<div class="phase-big"><div class="emoji">'+phase.emoji+'</div><div class="name">'+phase.name+'</div><div class="desc">'+phase.desc+'</div><div class="tiny muted" style="margin-top:8px">距离下一阶段 '+Math.floor(tr.min/60)+'h '+(tr.min%60)+'m</div></div><div class="grid-2"><div class="col-left">'+leftCol+'</div><div class="col-right">'+rightCol+'</div></div>';
}

function renderSingleStep(){
  const n=findStepById(singleStep.id); if(!n){ singleStep=null; renderAll(); return; }
  const m=document.getElementById('modal');
  m.innerHTML='<div class="single-step"><div class="label">只做这一步，其他什么都不用想</div><div class="task">'+esc(n.n.title)+'</div><div class="meta">来自：'+esc(n.q.title)+(n.n.est?' · 预估 '+n.n.est+' 分钟':'')+'</div><div class="actions"><button class="btn ok block big" data-act="single-done">✓ 我完成了</button><button class="btn ghost block" data-act="single-skip">跳过，换下一步</button><button class="btn block" data-act="single-exit">退出单步模式</button></div></div>';
}
function findStepById(id){ for(let i=0;i<S.quests.length;i++){ const n=S.quests[i].line.find(function(x){ return x.id===id; }); if(n) return {n:n,q:S.quests[i]}; } return null; }
function findLineItemDeep(qid,sid){
  var q=findQuest(qid); if(!q) return null;
  function search(items){
    for(var i=0;i<items.length;i++){
      if(items[i].id===sid) return {n:items[i],q:q};
      if(items[i].children&&items[i].children.length){
        var r=search(items[i].children);
        if(r) return r;
      }
    }
    return null;
  }
  return search(q.line);
}
function removeLineItemDeep(q,sid){
  for(var i=0;i<q.line.length;i++){
    if(q.line[i].id===sid){ return q.line.splice(i,1)[0]; }
    if(q.line[i].children&&q.line[i].children.length){
      var r=removeLineItemDeep({line:q.line[i].children},sid);
      if(r){ q.line[i].children=q.line[i].children.filter(function(x){ return x.id!==sid; }); if(!q.line[i].children.length) delete q.line[i].children; return r; }
    }
  }
  return null;
}
function collectAllLineItems(items){
  var result=[];
  function walk(arr){
    for(var i=0;i<arr.length;i++){
      result.push(arr[i]);
      if(arr[i].children&&arr[i].children.length) walk(arr[i].children);
    }
  }
  walk(items);
  return result;
}

function vQuests(){
  const v=document.getElementById('view-quests');
  const qs=S.quests.slice().sort(function(a,b){ return b.updated-a.updated; });
  const listHTML='<div class="row between" style="margin:6px 0 10px"><h2 class="card-title" style="margin:0">任务 · '+qs.length+'</h2><button class="btn sm pri" data-act="new-quest">➕ 新建</button></div><div class="card" style="padding:12px 14px"><div class="tiny">输入一件事会自动识别类型并拆成执行小步。每个任务都可以走「网→树→线」三段。</div></div>'+qs.map(function(q){
    const p=progress(q); const nxt=q.line.find(function(x){ return !x.done; });
    const activeClass=(openQuest===q.id?' style="border-color:var(--pri);box-shadow:0 0 0 2px rgba(217,140,95,.15)"':'');
    return '<div class="quest-item hoverable"'+activeClass+'><div class="title">'+esc(q.title)+'</div><div class="meta"><span class="badge '+q.status+'">'+(q.status==='net'?'🕸 网':q.status==='tree'?'🌳 树':'✅ 线')+'</span> · '+(TEMPLATES[q.type]&&TEMPLATES[q.type].label||'通用')+' · '+(q.today?'☀️ 今天':'📦 仓库')+' · '+(nxt?'下一步：'+esc(nxt.title):'已完成')+'</div><div class="progress"><i style="width:'+p+'%"></i></div><div class="row"><button class="btn sm" data-act="open-quest" data-id="'+q.id+'">打开</button><button class="btn sm" data-act="focus-quest" data-id="'+q.id+'">🎯 下一步</button>'+(q.today?'<button class="btn sm ghost" data-act="q-untoday" data-id="'+q.id+'">移出今天</button>':'<button class="btn sm ghost" data-act="q-today" data-id="'+q.id+'">☀️ 今天</button>')+'</div></div>';

  <div class="card"><div class="row between"><b class="tiny">`+(q.goodEnough.mode==='60'?'60 分止损版':'100 分完整版')+'</b><button class="btn xs" data-act="toggle-good" data-id="'+q.id+'">切换</button></div><textarea id="q-good" style="margin-top:8px;background:transparent;border:none;padding:4px 0;min-height:50px" placeholder="写下这个版本的完成标准...">'+esc(q.goodEnough.mode==='60'?q.goodEnough.sixty:q.goodEnough.hundred)+`</textarea></div>
  <div id="quest-workspace"></div><div style="height:50px"></div>`;

function probeHTML(q){

function renderQuestWorkspace(q){
  const el=document.getElementById('quest-workspace'); if(!el) return;
  el.innerHTML={net:vNet(q),tree:vTree(q),line:vLine(q)}[q.status] || vNet(q);
  if(q.status==='net') bindNetCanvas(q);
}

function vNet(q){
  const nodes=q.net.nodes||[], edges=q.net.edges||[], offset=q.net.viewOffset||{x:0,y:0};
  const highlightedCount=nodes.filter(function(n){ return n.highlighted; }).length;
  const tableHTML=nodes.length?'<div class="net-table"><table><thead><tr><th class="idx">#</th><th>节点文本</th><th>连线</th></tr></thead><tbody>'+nodes.map(function(n,idx){ const conn=edges.filter(function(e){ return e.from===n.id||e.to===n.id; }).length; return '<tr data-act="net-focus-node" data-id="'+q.id+'" data-nid="'+n.id+'"><td class="idx">'+(idx+1)+'</td><td><span class="hl-mark" style="background:'+(n.highlighted?'#ff9800':'transparent')+'"></span>'+esc(n.text)+'</td><td>'+conn+'</td></tr>'; }).join('')+'</tbody></table></div>':'<div class="tiny muted" style="margin-top:8px">暂无节点</div>';
  return '<h2 class="card-title">🕸 网状构思区</h2><div class="card" style="padding:12px 14px"><div class="tiny">规则：5 分钟内疯狂丢关键词 → 圈出核心节点 → 连线关联 → 超时进树状区<br>拖拽空白处平移画布 · 节点可拖拽移动 · 双击删除</div></div><div class="row" style="margin-bottom:10px"><input id="net-input" class="grow" placeholder="输入关键词/想法"><button class="btn pri sm" data-act="net-add" data-id="'+q.id+'">添加</button><button class="btn sm '+(selectedNetNodes.length>=2?'':'disabled')+'" data-act="net-link" data-id="'+q.id+'" '+(selectedNetNodes.length<2?'disabled':'')+'>连线</button><button class="btn sm warn" data-act="net-clear" data-id="'+q.id+'">清空</button></div><div class="net-viewport" id="net-viewport"><div class="net-canvas" id="net-canvas" style="transform:translate('+(-offset.x)+'px,'+(-offset.y)+'px)">'+edges.map(function(e){ return netEdgeHTML(q,e); }).join('')+nodes.map(function(n){ return netNodeHTML(n,q); }).join('')+'</div><div class="net-controls"><button class="btn" data-act="net-center" data-id="'+q.id+'" title="回到中心">🏠 中心</button><button class="btn" data-act="net-highlight" data-id="'+q.id+'" title="标记/取消标记选中节点">🎨 高亮</button></div><div class="net-counter">节点 '+nodes.length+(highlightedCount?' · 高亮 '+highlightedCount:'')+'</div><div class="hint">点击节点选中，再点另一个连线 · 拖拽移动 · 双击删除</div></div>'+tableHTML+'<button class="btn block pri" style="margin-top:10px" data-act="to-tree" data-id="'+q.id+'">🌳 已圈出核心，进入树状区</button>';
}
function netNodeHTML(n,q){ const selected=selectedNetNodes.indexOf(n.id)>-1; return '<div class="net-node '+(selected?'selected':'')+(n.highlighted?' highlighted':'')+'" id="nn-'+n.id+'" data-id="'+n.id+'" style="left:'+n.x+'px;top:'+n.y+'px">'+esc(n.text)+'</div>'; }
function netEdgeHTML(q,e){ const a=q.net.nodes.find(function(x){ return x.id===e.from; }), b=q.net.nodes.find(function(x){ return x.id===e.to; }); if(!a||!b) return ''; const dx=b.x-a.x, dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy), ang=Math.atan2(dy,dx)*180/Math.PI; return '<div class="net-edge" style="left:'+(a.x+10)+'px;top:'+(a.y+14)+'px;width:'+len+'px;transform:rotate('+ang+'deg)"></div>'; }
function bindNetCanvas(q){
  const viewport=document.getElementById('net-viewport'); const canvas=document.getElementById('net-canvas'); if(!viewport||!canvas) return;
  let dragNode=null, dragOff={}, panning=false, panStart={x:0,y:0}, panOff={x:0,y:0};
  const getOffset=function(){ return q.net.viewOffset||{x:0,y:0}; };
  canvas.querySelectorAll('.net-node').forEach(function(node){
    node.onpointerdown=function(e){
      e.stopPropagation(); dragNode=node.dataset.id; const n=q.net.nodes.find(function(x){ return x.id===dragNode; });
      dragOff={x:e.clientX,y:e.clientY,nx:n.x,ny:n.y}; node.setPointerCapture(e.pointerId);
    };
    node.onpointermove=function(e){
      if(!dragNode || dragNode!==node.dataset.id) return;
      const dx=e.clientX-dragOff.x, dy=e.clientY-dragOff.y;
      const n=q.net.nodes.find(function(x){ return x.id===dragNode; });
      n.x=Math.max(0,Math.min(dragOff.nx+dx,4000-80));
      n.y=Math.max(0,Math.min(dragOff.ny+dy,4000-40));
      node.style.left=n.x+'px'; node.style.top=n.y+'px'; renderNetEdges(q);
    };
    node.onpointerup=function(e){ dragNode=null; save(); };
    node.onclick=function(e){ e.stopPropagation(); toggleSelect(q,node.dataset.id); };
    node.ondblclick=function(e){
      e.stopPropagation();
      const delNode=q.net.nodes.find(function(x){ return x.id===node.dataset.id; });
      if(delNode) trashItem('net',delNode,q.id);
      q.net.nodes=q.net.nodes.filter(function(x){ return x.id!==node.dataset.id; });
      q.net.edges=q.net.edges.filter(function(x){ return x.from!==node.dataset.id && x.to!==node.dataset.id; });
      selectedNetNodes=selectedNetNodes.filter(function(id){ return id!==node.dataset.id; });
      renderQuestWorkspace(q); save();
    };
  });
  viewport.onmousedown=function(e){
    if(e.target.closest('.net-node')||e.target.closest('.net-controls')||e.target.closest('.net-counter')) return;
    panning=true; panStart={x:e.clientX,y:e.clientY}; panOff={...getOffset()};
    viewport.style.cursor='grabbing'; e.preventDefault();
  };
  viewport.onmousemove=function(e){
    if(!panning) return;
    const off=getOffset();
    off.x=Math.max(0,Math.min(panOff.x+e.clientX-panStart.x,4000-viewport.clientWidth));
    off.y=Math.max(0,Math.min(panOff.y+e.clientY-panStart.y,4000-viewport.clientHeight));
    canvas.style.transform='translate('+(-off.x)+'px,'+(-off.y)+'px)'; save();
  };
  viewport.onmouseup=function(){ panning=false; viewport.style.cursor=''; };
  viewport.onmouseleave=function(){ panning=false; viewport.style.cursor=''; };
  viewport.onclick=function(e){ if(!e.target.closest('.net-node')&&!e.target.closest('.net-controls')){ selectedNetNodes=[]; renderQuestWorkspace(q); } };
}
function toggleSelect(q,id){
  const i=selectedNetNodes.indexOf(id);
  if(i>-1) selectedNetNodes.splice(i,1); else selectedNetNodes.push(id);
  document.querySelectorAll('#net-canvas .net-node').forEach(function(el){ el.classList.toggle('selected',selectedNetNodes.indexOf(el.dataset.id)>-1); });
  const btn=document.querySelector('[data-act=net-link]'); if(btn){ if(selectedNetNodes.length<2){ btn.disabled=true; btn.classList.add('disabled'); }else{ btn.disabled=false; btn.classList.remove('disabled'); } }
}
function renderNetEdges(q){
  const canvas=document.getElementById('net-canvas'); if(!canvas) return;
  canvas.querySelectorAll('.net-edge').forEach(function(e){ e.remove(); });
  const frag=document.createDocumentFragment();
  q.net.edges.forEach(function(edge){
    const div=document.createElement('div'); div.className='net-edge';
    const style=netEdgeHTML(q,edge).match(/style="([^"]+)"/)[1];
    div.style.cssText=style; frag.appendChild(div);
  });
  canvas.insertBefore(frag,canvas.firstChild);
}

function vTree(q){
  return '<h2 class="card-title">🌳 树状翻译区</h2><div class="card" style="padding:12px 14px"><div class="tiny">把节点拖进下面 5 类抽屉。放不进去说明不够具体，回网状区再切。</div></div><div class="row" style="margin-bottom:10px"><button class="btn pri sm" data-act="tree-add" data-id="'+q.id+'">➕ 新增抽屉项</button><button class="btn sm" data-act="to-line" data-id="'+q.id+'">✅ 生成执行线</button><button class="btn sm" data-act="back-net" data-id="'+q.id+'">↩ 回网状区</button><button class="btn sm" data-act="tree-expand-all" data-id="'+q.id+'">📂 全部展开</button><button class="btn sm" data-act="tree-collapse-all" data-id="'+q.id+'">📁 全部收起</button></div><div class="row">'+q.tree.drawers.map(function(d){ const collapsed=d.collapsed; return '<div style="flex:1;min-width:140px" ondragover="event.preventDefault()" ondrop="dropToDrawer(event,\''+q.id+'\',\''+d.id+'\')"><div class="tree-root" style="border-left:3px solid '+d.color+'"><h4 style="color:'+d.color+'">'+d.name+' <button class="btn xs ghost" data-act="tree-toggle" data-id="'+q.id+'" data-did="'+d.id+'">'+(collapsed?'▶':'▼')+'</button></h4>'+(collapsed?'<div class="tiny muted">'+d.items.length+' 项（已收起）</div>':d.items.map(function(it){ return '<div class="tree-item" draggable="true" ondragstart="dragItem(event,\''+q.id+'\',\''+d.id+'\',\''+it.id+'\')"><span class="handle">⋮⋮</span><span class="grow">'+esc(it.text)+'</span><button class="btn xs ghost" onclick="removeTreeItem(\''+q.id+'\',\''+d.id+'\',\''+it.id+'\')">✕</button></div>'; }).join(''))+(d.items.length?'':'<div class="tiny muted">空</div>')+'</div></div>'; }).join('')+'</div>';
}
function vLine(q){
  function renderLineStep(n,qid,depth){
    depth=depth||0;
    var hasChildren=n.children&&n.children.length>0;
    var isCollapsed=n.collapsed;
    var doneKids=hasChildren?n.children.filter(function(c){ return c.done; }).length:0;
    var foldHTML=hasChildren?'<div class="fold-btn" data-act="line-fold" data-qid="'+qid+'" data-id="'+n.id+'" title="'+(isCollapsed?'展开 '+n.children.length+' 个子步骤':'收起 '+n.children.length+' 个子步骤')+'">'+(isCollapsed?'\u25B6':'\u25BC')+'<span class="cnt">'+n.children.length+'</span></div>':'<div class="fold-spacer"></div>';
    var childrenHTML='';
    if(hasChildren&&!isCollapsed){
      childrenHTML='<div class="line-children">'+n.children.map(function(c){ return renderLineStep(c,qid,depth+1); }).join('')+'</div>';
    }
    return '<div class="line-step depth-'+depth+' '+(n.done?'done':'')+'" data-depth="'+depth+'">'+foldHTML+'<div class="chk '+(n.done?'on':'')+'" data-act="line-toggle" data-qid="'+qid+'" data-id="'+n.id+'">\u2713</div><div class="grow"><div class="row" style="gap:6px;flex-wrap:wrap"><span style="font-weight:500;'+(n.done?'text-decoration:line-through':'')+'">'+esc(n.title)+'</span><span class="badge">'+(n.est||0)+'\u5206</span>'+(n.today?'<span class="badge linec">\u4ECA\u5929</span>':'')+(hasChildren?'<span class="badge">'+doneKids+'/'+n.children.length+' \u5B50\u6B65</span>':'')+'</div><div class="row" style="margin-top:6px;gap:5px"><button class="btn xs" data-act="line-today" data-qid="'+qid+'" data-id="'+n.id+'">'+(n.today?'\u79FB\u51FA':'\u2600\uFE0F \u4ECA\u5929')+'</button><button class="btn xs ghost" data-act="line-split" data-qid="'+qid+'" data-id="'+n.id+'">\u{1F52A} \u5207\u5C0F</button><button class="btn xs ghost" data-act="line-sub" data-qid="'+qid+'" data-id="'+n.id+'">+\u5B50\u6B65</button>'+(hasChildren?'<button class="btn xs ghost" data-act="line-del-children" data-qid="'+qid+'" data-id="'+n.id+'">\u5220\u5B50\u6B65</button>':'')+'<button class="btn xs ghost" data-act="line-del" data-qid="'+qid+'" data-id="'+n.id+'">\u{1F5D1}</button></div></div></div>'+childrenHTML;
  }
  return '<h2 class="card-title">\u2705 \u7EBF\u6027\u6267\u884C\u533A</h2><div class="card" style="padding:12px 14px"><div class="tiny">\u8FD9\u91CC\u662F\u300C\u624B\u4E0A\u8D70\u7EBF\u300D\u3002\u65B0\u60F3\u6CD5\u4E22\u505C\u8F66\u533A\uFF0C\u4E0D\u8BB8\u6539\u8FD9\u91CC\u3002\u70B9 \u25B6/\u25BC \u6536\u7EB3\u5B50\u6B65\u9AA4\u3002</div></div><div class="row" style="margin-bottom:10px"><input id="line-input" class="grow" placeholder="\u6DFB\u52A0\u4E00\u6B65" style="flex:2"><input type="number" id="line-est" placeholder="\u5206\u949F" value="15" min="1" max="180" style="width:70px"><button class="btn pri sm" data-act="line-add" data-id="'+q.id+'">\u6DFB\u52A0</button><button class="btn sm" data-act="back-tree" data-id="'+q.id+'">\u21A9 \u56DE\u6811</button>'+(q.line.some(function(n){ return n.children&&n.children.length; })?'<button class="btn sm" data-act="line-expand-all" data-id="'+q.id+'">\u{1F4C2} \u5168\u90E8\u5C55\u5F00</button><button class="btn sm" data-act="line-collapse-all" data-id="'+q.id+'">\u{1F4C1} \u5168\u90E8\u6536\u8D77</button>':'')+'</div>'+(q.line.length?q.line.map(function(n){ return renderLineStep(n,q.id,0); }).join(''):'<div class="empty tiny">\u6267\u884C\u7EBF\u4E3A\u7A7A\u3002\u4ECE\u6811\u72B6\u533A\u751F\u6210\uFF0C\u6216\u624B\u52A8\u6DFB\u52A0\u3002</div>')+'<div class="row" style="margin-top:12px"><button class="btn sm block" data-act="line-focus-next" data-id="'+q.id+'">\u{1F3AF} \u4E13\u6CE8\u4E0B\u4E00\u6B65</button><button class="btn sm block" data-act="line-pick" data-id="'+q.id+'">\u{1F3B2} \u968F\u673A\u6311\u4E00\u6B65</button></div>';
}

/* Events */
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA' || e.target.tagName==='SELECT') return;
  if(e.key==='n' || e.key==='N'){ e.preventDefault(); openNewQuestSheet(); }
  if(e.key==='f' || e.key==='F'){ e.preventDefault(); const next=nextLineItem(); if(next){ singleStep={id:next.n.id,start:Date.now()}; renderAll(); } }
  if(e.key==='Escape'){ closeModal(); }
});
document.addEventListener('change',function(e){
  const s=e.target.closest('.note-move');
  if(s){ const n=S.notes.find(function(x){ return x.id===s.dataset.id; }); if(n){ n.zone=s.value; n.updated=Date.now(); save(); renderAll(); } }
});
document.addEventListener('click',function(e){
  if(singleStep){
    const b=e.target.closest('[data-act]');
    if(b && b.dataset.act==='single-done'){ completeSingleStep(); return; }
    if(b && b.dataset.act==='single-skip'){ skipSingleStep(); return; }
    if(b && b.dataset.act==='single-exit'){ singleStep=null; document.getElementById('modal').innerHTML=''; renderAll(); return; }
    return;
  }
  const t=e.target.closest('[data-tab]');
  if(t){ TAB=t.dataset.tab; if(TAB!=='quests') openQuest=null; selectedNetNodes=[]; renderAll(); window.scrollTo(0,0); return; }

  const row=e.target.closest('.line-step');
  const todayItem=e.target.closest('.today-list .item');
  if(row && !e.target.closest('[data-act]')){ const idNode=row.querySelector('[data-id]'); if(idNode) toggleStep(idNode.dataset.id); return; }
  if(todayItem && !e.target.closest('[data-act]')){ toggleStep(todayItem.dataset.id); return; }

  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;

  switch(a){
    case 'onboarding-add':{
      const inp=document.getElementById('onboarding-input'); const v=inp&&inp.value.trim(); if(!v) return;
      const q=newQuest(v); S.quests.unshift(q); q.today=true; save(); renderAll(); toast('已拆解，开始第一步'); break;
    }
    case 'start-single':{ singleStep={id:b.dataset.id,start:Date.now()}; renderAll(); break; }
    case 'new-quest':{ openNewQuestSheet(); break; }
    case 'create-quest':{
      const titleEl=document.getElementById('q-title'); const title=titleEl&&titleEl.value.trim(); if(!title) return toast('写个名字');
      const typeEl=document.getElementById('q-type'); const type=typeEl?typeEl.value:'project';
      const q=newQuest(title); q.type=type; S.quests.unshift(q); save(); closeModal(); openQuest=q.id; TAB='quests'; renderAll(); toast('任务已创建'); break;
    }
    case 'save-quest':{
      const q=findQuest(id); const titleEl=document.getElementById('q-title'); const typeEl=document.getElementById('q-type');
      if(q && titleEl){ q.title=titleEl.value.trim()||q.title; if(typeEl) q.type=typeEl.value; save(); closeModal(); renderAll(); }
      break;
    }
    case 'del-quest':{ if(confirm('删除这个任务？（进入回收站，3天后自动清理）')){ const q=findQuest(id); if(q) trashItem('quest',q); S.quests=S.quests.filter(function(x){ return x.id!==id; }); closeModal(); openQuest=null; save(); renderAll(); } break; }
    case 'open-quest':{ openQuest=id; selectedNetNodes=[]; renderAll(); break; }
    case 'back-quests':{ openQuest=null; selectedNetNodes=[]; renderAll(); break; }
    case 'edit-quest':{ openEditQuestSheet(id); break; }
    case 'focus-quest':{
      const q=findQuest(id); if(!q) return;
      const items=q.line.filter(function(n){ return !n.done; }).sort(function(x,y){ return (x.est||99)-(y.est||99); });
      if(!items.length) return toast('没有可执行的步骤');
      singleStep={id:items[0].id,start:Date.now()}; renderAll(); break;
    }
    case 'q-today':{ const q=findQuest(id); if(q){ q.today=true; q.updated=Date.now(); save(); renderAll(); } break; }
    case 'q-untoday':{ const q=findQuest(id); if(q){ q.today=false; q.updated=Date.now(); save(); renderAll(); } break; }

    case 'tab-net':case 'tab-tree':case 'tab-line':{ const q=findQuest(id); if(q){ q.status=a.replace('tab-',''); q.updated=Date.now(); save(); renderAll(); } break; }
    case 'net-add':{
      const q=findQuest(id); const inp=document.getElementById('net-input'); const v=inp&&inp.value.trim(); if(!q||!v) return;
      q.net.nodes.push({id:uid(),text:v,x:q.net.nextX,y:q.net.nextY}); q.net.nextX=(q.net.nextX+90)%280; if(q.net.nextX<50) q.net.nextX=50; q.net.nextY=(q.net.nextY+60)%240; if(q.net.nextY<50) q.net.nextY=50;
      inp.value=''; q.updated=Date.now(); save(); renderAll(); break;
    }
    case 'net-link':{
      const q=findQuest(id); if(q && selectedNetNodes.length>=2){ q.net.edges.push({from:selectedNetNodes[0],to:selectedNetNodes[1]}); selectedNetNodes=[]; q.updated=Date.now(); save(); renderAll(); } break;
    }
    case 'net-clear':{ const q=findQuest(id); q.net.nodes=[]; q.net.edges=[]; selectedNetNodes=[]; save(); renderAll(); break; }
    case 'net-center':{ const q=findQuest(id); if(!q.net.viewOffset) q.net.viewOffset={x:0,y:0}; q.net.viewOffset.x=0; q.net.viewOffset.y=0; save(); renderAll(); break; }
    case 'net-highlight':{ const q=findQuest(id); selectedNetNodes.forEach(function(nid){ const n=q.net.nodes.find(function(x){ return x.id===nid; }); if(n) n.highlighted=!n.highlighted; }); selectedNetNodes=[]; save(); renderAll(); break; }
    case 'net-focus-node':{ const q=findQuest(b.dataset.id); const nid=b.dataset.nid; const n=q.net.nodes.find(function(x){ return x.id===nid; }); if(q&&n){ q.net.viewOffset={x:Math.max(0,n.x-150),y:Math.max(0,n.y-100)}; save(); renderAll(); const el=document.getElementById('nn-'+nid); if(el){ el.style.transition='box-shadow .3s'; el.style.boxShadow='0 0 0 4px var(--net)'; setTimeout(function(){ if(el) el.style.boxShadow=''; },800); } } break; }
    case 'to-tree':{ const q=findQuest(id); q.status='tree'; q.updated=Date.now(); save(); renderAll(); break; }
    case 'back-net':{ const q=findQuest(id); q.status='net'; q.updated=Date.now(); save(); renderAll(); break; }
    case 'tree-add':{
      const q=findQuest(id);
      sheet('<h3>新增抽屉项</h3><input id="tree-text" placeholder="一句话"><select id="tree-drawer" style="margin-top:8px">'+q.tree.drawers.map(function(d){ return '<option value="'+d.id+'">'+d.name+'</option>'; }).join('')+'</select><button class="btn pri block" style="margin-top:12px" data-act="tree-add-confirm" data-id="'+q.id+'">添加</button>');
      break;
    }
    case 'tree-add-confirm':{
      const q=findQuest(id); const textEl=document.getElementById('tree-text'); const text=textEl&&textEl.value.trim(); const didEl=document.getElementById('tree-drawer'); const did=didEl&&didEl.value;
      if(q && text && did){ q.tree.drawers.find(function(d){ return d.id===did; }).items.push({id:uid(),text:text}); q.updated=Date.now(); save(); closeModal(); renderAll(); }
      break;
    }
    case 'to-line':{
      const q=findQuest(id); const action=q.tree.drawers.find(function(d){ return d.id==='action'; });
      q.line=action.items.map(function(it){ return {id:uid(),title:it.text,est:15,done:false,spent:0,today:false,created:Date.now()}; });
      if(!q.line.length) q.line=q.tree.drawers.flatMap(function(d){ return d.items.map(function(it){ return {id:uid(),title:'['+dName(d.id)+'] '+it.text,est:15,done:false,spent:0,today:false,created:Date.now()}; }); });
      q.status='line'; q.updated=Date.now(); save(); renderAll(); toast('生成 '+q.line.length+' 步'); break;
    }
    case 'back-tree':{ const q=findQuest(id); q.status='tree'; q.updated=Date.now(); save(); renderAll(); break; }
    case 'tree-toggle':{ const q=findQuest(id); const d=q.tree.drawers.find(function(x){ return x.id===b.dataset.did; }); if(d){ d.collapsed=!d.collapsed; save(); renderAll(); } break; }
    case 'tree-expand-all':{ const q=findQuest(id); q.tree.drawers.forEach(function(d){ d.collapsed=false; }); save(); renderAll(); break; }
    case 'tree-collapse-all':{ const q=findQuest(id); q.tree.drawers.forEach(function(d){ d.collapsed=true; }); save(); renderAll(); break; }
    case 'line-add':{
      const q=findQuest(id); const titleEl=document.getElementById('line-input'); const title=titleEl&&titleEl.value.trim(); const estEl=document.getElementById('line-est'); const est=parseInt(estEl&&estEl.value)||15;
      if(q && title){ q.line.push({id:uid(),title:title,est:Math.max(1,Math.min(180,est)),done:false,spent:0,today:false,created:Date.now()}); save(); renderAll(); } break;
    }
    case 'line-toggle':{ toggleStep(b.dataset.id); break; }
    case 'line-today':{ const r=findLineItemDeep(b.dataset.qid,b.dataset.id); if(r){ r.n.today=!r.n.today; save(); renderAll(); } break; }
    case 'line-split':{ const r=findLineItemDeep(b.dataset.qid,b.dataset.id); if(r){ const n=r.n; const e=Math.max(5,Math.round((n.est||20)/2)); n.est=e; if(!n.children) n.children=[]; n.children.push({id:uid(),title:n.title+'(后半)',est:e,done:false,spent:0,today:false,created:Date.now()}); n.collapsed=false; save(); renderAll(); toast('已切半为子步骤'); } break; }
    case 'line-sub':{ openLineSubSheet(b.dataset.qid,b.dataset.id); break; }
    case 'line-sub-confirm':{
      const r=findLineItemDeep(b.dataset.qid,b.dataset.id); if(!r) break;
      const ti=document.getElementById('sub-title'); const t=ti&&ti.value.trim(); if(!t) return toast('写个标题');
      const ei=document.getElementById('sub-est'); const e=parseInt(ei&&ei.value)||10;
      const n=r.n; if(!n.children) n.children=[];
      n.children.push({id:uid(),title:t,est:e,done:false,spent:0,today:false,created:Date.now()});
      n.collapsed=false; save(); closeModal(); renderAll(); toast('已添加子步骤'); break;
    }
    case 'line-fold':{ const r=findLineItemDeep(b.dataset.qid,b.dataset.id); if(r){ r.n.collapsed=!r.n.collapsed; save(); renderAll(); } break; }
    case 'line-expand-all':{ const q=findQuest(id); if(q) collectAllLineItems(q.line).forEach(function(n){ n.collapsed=false; }); save(); renderAll(); toast('已全部展开'); break; }
    case 'line-collapse-all':{ const q=findQuest(id); if(q) collectAllLineItems(q.line).forEach(function(n){ if(n.children&&n.children.length) n.collapsed=true; }); save(); renderAll(); toast('已全部收起'); break; }
    case 'line-del-children':{ const r=findLineItemDeep(b.dataset.qid,b.dataset.id); if(r&&r.n.children&&r.n.children.length){ if(confirm('删除这个步骤下的 '+r.n.children.length+' 个子步骤？（进入回收站）')){ r.n.children.forEach(function(c){ trashItem('line',c,r.q.id); }); delete r.n.children; r.n.collapsed=false; save(); renderAll(); toast('已删除子步骤'); } } break; }
    case 'line-del':{ const q=findQuest(b.dataset.qid); var removed=removeLineItemDeep(q,b.dataset.id); if(removed) trashItem('line',removed,q.id); save(); renderAll(); break; }
    case 'line-focus-next':{ const q=findQuest(id); var items=collectAllLineItems(q.line).filter(function(n){ return !n.done; }).sort(function(x,y){ return (x.est||99)-(y.est||99); }); if(items.length){ singleStep={id:items[0].id,start:Date.now()}; renderAll(); } else toast('都做完了'); break; }
    case 'line-pick':{ const q=findQuest(id); var items=collectAllLineItems(q.line).filter(function(n){ return !n.done; }); if(items.length){ const pick=items[Math.floor(Math.random()*items.length)]; singleStep={id:pick.id,start:Date.now()}; renderAll(); } else toast('都做完了'); break; }

    /* 便利贴 */
    case 'note-add':{ S.notes.unshift({id:uid(),text:'新便利贴',zone:b.dataset.zone||'ei',created:Date.now(),updated:Date.now()}); save(); renderAll(); const ns=S.notes[0]; if(ns) openNoteSheet(ns); break; }
    case 'note-edit':{ const n=S.notes.find(function(x){ return x.id===id; }); if(n) openNoteSheet(n); break; }
    case 'note-save':{ const n=S.notes.find(function(x){ return x.id===id; }); const ta=document.getElementById('note-text'); const za=document.getElementById('note-zone'); if(n&&ta){ n.text=ta.value.trim()||'未命名便利贴'; n.zone=za&&za.value||n.zone; n.updated=Date.now(); save(); closeModal(); renderAll(); } break; }
    case 'note-del':{ S.notes=S.notes.filter(function(x){ return x.id!==id; }); save(); closeModal(); renderAll(); break; }
    case 'note-to':{ const n=S.notes.find(function(x){ return x.id===id; }); if(n) openNoteToSheet(n); break; }
    case 'note-to-confirm':{
      const n=S.notes.find(function(x){ return x.id===id; }); if(!n) break;
      const qEl=document.getElementById('nt-quest'); const q=findQuest(qEl&&qEl.value); if(!q) return toast('没有可选任务，先去建一个');
      const formEl=document.getElementById('nt-form'); const form=formEl&&formEl.value;
      if(form==='line'){ q.line.push({id:uid(),title:n.text,est:15,done:false,spent:0,today:false,created:Date.now()}); }
      else if(form==='tree'){ const dSel=document.getElementById('nt-drawer'); const did=dSel&&dSel.value||'action'; const d=q.tree.drawers.find(function(x){ return x.id===did; }); if(d) d.items.push({id:uid(),text:n.text}); }
      else if(form==='net'){ const nx=(q.net.nextX||60)+ (q.net.nodes.length%6)*30; const ny=(q.net.nextY||60)+ Math.floor(q.net.nodes.length/6)*40; q.net.nodes.push({id:uid(),text:n.text,x:nx,y:ny,highlighted:false}); }
      q.updated=Date.now(); save(); closeModal(); renderAll(); toast('已加入'+(form==='line'?'线':form==='tree'?'树':'网'));
      break;
    }

    case 'toggle-probe':{ const q=findQuest(id); q.probe.active=!q.probe.active; save(); renderAll(); break; }
    case 'save-probe':{
      const q=findQuest(id); const h=document.getElementById('probe-hyp'), s=document.getElementById('probe-success'), st=document.getElementById('probe-stop'), d=document.getElementById('probe-days');
      q.probe.hypothesis=h&&h.value.trim()||''; q.probe.success=s&&s.value.trim()||''; q.probe.stopLoss=st&&st.value.trim()||''; q.probe.days=parseInt(d&&d.value)||7;
      save(); renderAll(); toast('探针已保存'); break;
    }
    case 'save-context':{
      const q=findQuest(id); const note=prompt('你现在卡在哪？'); if(note===null) return;
      q.context.lastNote=note; q.context.lastAt=Date.now(); save(); renderAll(); toast('已记录卡点'); break;
    }
    case 'toggle-good':{
      const q=findQuest(id); const ta=document.getElementById('q-good'); if(!q||!ta) return;
      if(q.goodEnough.mode==='60'){ q.goodEnough.sixty=ta.value.trim(); q.goodEnough.mode='100'; } else { q.goodEnough.hundred=ta.value.trim(); q.goodEnough.mode='60'; }
      save(); renderAll(); break;
    }

    case 'park-add':{
      const inp=document.getElementById('park-text'); const v=inp&&inp.value.trim(); const catEl=document.getElementById('park-cat'); const cat=catEl&&catEl.value||'idea'; if(!v) return;
      S.parking[cat].push({id:uid(),text:v,t:Date.now()}); save(); inp.value=''; toast('已记录'); renderAll(); break;
    }
    case 'park-del':{ const cat=b.dataset.cat; const it=S.parking[cat].find(function(x){ return x.id===id; }); if(it) trashItem('parking',{cat:cat,item:it}); S.parking[cat]=S.parking[cat].filter(function(x){ return x.id!==id; }); save(); renderAll(); break; }
    case 'park-2quest':{
      const cat=b.dataset.cat; const it=S.parking[cat].find(function(x){ return x.id===id; }); if(!it) return;
      S.parking[cat]=S.parking[cat].filter(function(x){ return x.id!==id; });
      const q=newQuest(it.text); S.quests.unshift(q); save(); renderAll(); toast('已转成任务'); break;
    }
    case 'distill-start':{
      const rawEl=document.getElementById('distill-raw'); const raw=rawEl&&rawEl.value.trim(); if(!raw) return;
      document.getElementById('distill-steps').innerHTML=distillHTML(raw); break;
    }
    case 'distill-save':{
      const rawEl=document.getElementById('distill-raw'); const raw=rawEl&&rawEl.value.trim();
      const title=raw.slice(0,30)+(raw.length>30?'...':'');
      const q=newQuest('整理：'+title);
      const scoutEl=document.getElementById('d-scout'), restructureEl=document.getElementById('d-restructure'), layersEl=document.getElementById('d-layers'), verifyEl=document.getElementById('d-verify');
      q.distill.scout=scoutEl&&scoutEl.value.trim()||''; q.distill.restructure=restructureEl&&restructureEl.value.trim()||''; q.distill.layers=layersEl&&layersEl.value.split('\n').filter(Boolean)||[]; q.distill.verify=verifyEl&&verifyEl.value.trim()||'';
      q.tree.drawers.find(function(d){ return d.id==='action'; }).items=q.distill.layers.map(function(l){ return {id:uid(),text:l}; });
      q.line=q.distill.layers.map(function(l){ return {id:uid(),title:l,est:15,done:false,spent:0,today:false,created:Date.now()}; });
      S.quests.unshift(q); save(); TAB='quests'; renderAll(); toast('已生成任务'); break;
    }

    case 'open-handoff':{ openHandoffSheet(); break; }
    case 'save-handoff':{
      const h3El=document.getElementById('h3'), h2El=document.getElementById('h2'), h1El=document.getElementById('h1');
      S.handoff.three=h3El&&h3El.value.trim()||''; S.handoff.two=h2El&&h2El.value.trim()||''; S.handoff.one=h1El&&h1El.value.trim()||'';
      S.handoff.date=todayKey(); S.handoff.morning=S.handoff.one; S.handoff.evening='3:'+S.handoff.three+'\n2:'+S.handoff.two+'\n1:'+S.handoff.one;
      save(); closeModal(); renderAll(); toast('交接完成，明早见'); break;
    }
    case 'save-settings':{
      const wakeEl=document.getElementById('set-wake'), startEl=document.getElementById('set-start'), windEl=document.getElementById('set-wind'), sleepEl=document.getElementById('set-sleep'), morningEl=document.getElementById('set-morning'), autoEl=document.getElementById('set-autonext');
      S.settings.wake=wakeEl&&wakeEl.value; S.settings.start=startEl&&startEl.value; S.settings.wind=windEl&&windEl.value; S.settings.sleep=sleepEl&&sleepEl.value;
      S.settings.morningBlock=morningEl&&morningEl.value==='true'; S.settings.autoNext=autoEl&&autoEl.value==='true';
      save(); renderAll(); toast('节律已保存'); break;
    }
    case 'export-data':{ exportData(); break; }
    case 'import-data':{ importData(); break; }
    case 'wipe-data':{ if(confirm('确定清空所有数据？不可恢复。')){ localStorage.removeItem(KEY); location.reload(); } break; }
    case 'open-trash':{ openTrashSheet(); break; }
    case 'trash-restore':{ if(restoreTrashItem(id)){ toast('已恢复'); save(); renderAll(); } else toast('恢复失败'); break; }
    case 'trash-delete':{ if(confirm('永久删除？不可恢复。')){ S.trash=S.trash.filter(function(x){ return x.id!==id; }); save(); renderAll(); openTrashSheet(); } break; }
    case 'trash-empty':{ if(confirm('清空回收站？所有项目将被永久删除。')){ S.trash=[]; save(); renderAll(); openTrashSheet(); } break; }
    case 'morning-task':{ toast('已加入早晨离线校准清单'); break; }
    case 'close-modal':{ closeModal(); break; }
  }
});

function toggleStep(id){
  const r=findStepById(id); if(!r) return;
  r.n.done=!r.n.done; r.q.updated=Date.now();
  if(r.n.done){
    const spent=singleStep && singleStep.start ? Math.round((Date.now()-singleStep.start)/1000) : 0;
    r.n.spent=(r.n.spent||0)+spent;
    S.log.sessions.push({id:uid(),title:r.n.title,est:r.n.est||15,start:Date.now()-spent*1000,end:Date.now(),secs:spent,finished:true});
    S.log.completions.push({id:uid(),qid:r.q.id,sid:r.n.id,t:Date.now()});
    bumpStreak();
  }
  save();
  if(r.n.done && S.settings.autoNext && singleStep && singleStep.id===id){
    const next=nextLineItem();
    if(next){ singleStep={id:next.n.id,start:Date.now()}; renderAll(); toast('下一步'); }
    else{ singleStep=null; document.getElementById('modal').innerHTML=''; renderAll(); toast('今天任务完成'); }
  } else {
    renderAll();
  }
}
function completeSingleStep(){
  if(!singleStep) return;
  toggleStep(singleStep.id);
}
function skipSingleStep(){
  const all=allLineItems().filter(function(x){ return !x.n.done; });
  if(!all.length){ singleStep=null; document.getElementById('modal').innerHTML=''; renderAll(); return; }
  let idx=-1; for(let i=0;i<all.length;i++){ if(all[i].n.id===singleStep.id){ idx=i; break; } }
  if(idx<0 || idx>=all.length-1) idx=-1;
  const next=all[idx+1] || all[0];
  if(next.n.id===singleStep.id){ singleStep=null; document.getElementById('modal').innerHTML=''; renderAll(); return; }
  singleStep={id:next.n.id,start:Date.now()}; renderAll();
}

function openLineSubSheet(qid,sid){
  const r=findLineItemDeep(qid,sid); if(!r) return;
  const n=r.n; const kids=(n.children||[]);
  sheet('<h3>➕ 加子步骤</h3><div class="tiny muted" style="margin-bottom:10px">挂在：'+esc(n.title)+'</div><input id="sub-title" placeholder="子步骤标题，比如：找 2 个可靠来源"><div class="row" style="margin-top:8px"><span class="tiny" style="min-width:36px">预估</span><input type="number" id="sub-est" value="10" min="1" max="180" style="width:90px"><span class="tiny">分钟</span></div><button class="btn pri block" style="margin-top:12px" data-act="line-sub-confirm" data-qid="'+qid+'" data-id="'+n.id+'">添加</button><button class="btn ghost block" style="margin-top:8px" data-act="close-modal">取消</button>'+(kids.length?'<div class="tiny muted" style="margin-top:12px">已有 '+kids.length+' 个子步骤</div>':''));
}

  sheet('<h3>新建任务</h3><input id="q-title" placeholder="例如：验证新的招聘流程 / 写年度总结"><select id="q-type" style="margin-top:8px"><option value="project">项目</option><option value="study">学习/研究</option><option value="probe">探针实验</option><option value="life">生活/杂务</option></select><button class="btn pri block" style="margin-top:12px" data-act="create-quest">创建</button><button class="btn ghost block" style="margin-top:8px" data-act="close-modal">取消</button>');
}
function openEditQuestSheet(id){
  const q=findQuest(id);
  sheet('<h3>编辑任务</h3><input id="q-title" value="'+esc(q.title)+'"><select id="q-type" style="margin-top:8px"><option value="project" '+(q.type==='project'?'selected':'')+'>项目</option><option value="study" '+(q.type==='study'?'selected':'')+'>学习/研究</option><option value="probe" '+(q.type==='probe'?'selected':'')+'>探针实验</option><option value="life" '+(q.type==='life'?'selected':'')+'>生活/杂务</option></select><button class="btn pri block" style="margin-top:12px" data-act="save-quest" data-id="'+q.id+'">保存</button><button class="btn warn block" style="margin-top:8px" data-act="del-quest" data-id="'+q.id+'">删除</button><button class="btn ghost block" style="margin-top:8px" data-act="close-modal">取消</button>');
}
function openHandoffSheet(){
  sheet('<h3>🌙 3-2-1 交接仪式</h3><div class="tiny muted" style="margin-bottom:12px">合上电脑前，把明天"加载期"要用的东西写出去。越少越好。</div><label class="tiny muted">3 — 明天最重要的 3 件事</label><textarea id="h3">'+esc(S.handoff.three||'')+'</textarea><label class="tiny muted" style="display:block;margin-top:10px">2 — 2 个待验证的假设/疑问</label><textarea id="h2">'+esc(S.handoff.two||'')+'</textarea><label class="tiny muted" style="display:block;margin-top:10px">1 — 明早睁眼后只做这一件</label><input id="h1" value="'+esc(S.handoff.one||'')+'"><button class="btn pri block" style="margin-top:14px" data-act="save-handoff">保存交接</button><button class="btn ghost block" style="margin-top:8px" data-act="close-modal">取消</button>');
}
function openTrashSheet(){
  const items=S.trash||[];
  const typeLabels={quest:'任务',line:'执行步',tree:'抽屉项',net:'节点',parking:'记录'};
  const now=Date.now();
  const listHTML=items.length?items.slice().sort(function(a,b){ return b.deletedAt-a.deletedAt; }).map(function(t){ const daysLeft=Math.max(0,Math.ceil((t.expiresAt-now)/864e5)); return '<div class="list-item" style="align-items:flex-start"><div style="flex:1"><div class="tiny">'+typeLabels[t.type]+' · '+new Date(t.deletedAt).toLocaleDateString()+' · '+daysLeft+'天后过期</div><div style="font-size:14px;margin-top:2px">'+(t.type==='quest'?(t.data.title||'任务'):t.type==='parking'?(t.data.item&&t.data.item.text||'记录'):t.type==='net'?(t.data.text||'节点'):t.type==='tree'?(t.data.item&&t.data.item.text||'抽屉项'):(t.data.title||'项目'))+'</div></div><div class="row" style="gap:5px"><button class="btn sm" data-act="trash-restore" data-id="'+t.id+'">恢复</button><button class="btn xs ghost" data-act="trash-delete" data-id="'+t.id+'">✕</button></div></div>'; }).join(''):'<div class="empty" style="padding:30px"><span class="big">🗑</span><div class="tiny" style="margin-top:8px">回收站为空</div></div>';
  sheet('<h3>🗑 回收站 <span class="badge">'+items.length+'</span></h3><div class="tiny muted" style="margin-bottom:12px">删除的项目暂存 3 天，过期后自动永久清理。</div>'+listHTML+(items.length?'<button class="btn warn block" style="margin-top:12px" data-act="trash-empty">清空回收站</button>':'')+'<button class="btn ghost block" style="margin-top:8px" data-act="close-modal">关闭</button>');
}
function sheet(html){ document.getElementById('modal').innerHTML='<div class="modal"><div class="modal-bg" data-act="close-modal"></div><div class="modal-sheet">'+html+'</div></div>'; }
function closeModal(){ document.getElementById('modal').innerHTML=''; }
function distillHTML(raw){
  return '<div class="card net"><b>侦察 Scout</b><div class="tiny muted">删掉噪音，列出 3-5 个核心信息点。</div><textarea id="d-scout" style="margin-top:8px;min-height:60px" placeholder="核心信息点..."></textarea></div><div class="card tree"><b>重构 Restructure</b><div class="tiny muted">用你自己的话压成一句话结论。</div><input id="d-restructure" placeholder="如果只看一句，结论是..."></div><div class="card linec"><b>分层 Layers</b><div class="tiny muted">把结论拆成可执行的层，每行一步。</div><textarea id="d-layers" style="min-height:80px" placeholder="1. ...\n2. ...\n3. ..."></textarea></div><div class="card"><b>校验 Verify</b><div class="tiny muted">做了之后能反向推出原来的结论吗？</div><input id="d-verify" placeholder="成功标准 / 验证方式"></div><button class="btn pri block" data-act="distill-save">生成任务</button>';
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='neuroos-'+todayKey()+'.json'; a.click();
}
function importData(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=function(){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=function(e){ try{ S=JSON.parse(e.target.result); migrate(); save(); location.reload(); }catch(err){ toast('导入失败'); } }; r.readAsText(f); };
  inp.click();
}

window.dragItem=function(ev,qid,did,iid){ ev.dataTransfer.setData('text/plain',JSON.stringify({qid:qid,did:did,iid:iid})); };
window.dropToDrawer=function(ev,qid,targetDid){
  ev.preventDefault();
  const data=JSON.parse(ev.dataTransfer.getData('text/plain'));
  const q=findQuest(qid); if(!q) return;
  const sD=q.tree.drawers.find(function(d){ return d.id===data.did; });
  const tD=q.tree.drawers.find(function(d){ return d.id===targetDid; });
  const it=sD.items.find(function(x){ return x.id===data.iid; }); if(!it) return;
  sD.items=sD.items.filter(function(x){ return x.id!==data.iid; }); tD.items.push(it); save(); renderAll();
};
window.removeTreeItem=function(qid,did,iid){
  const q=findQuest(qid); const d=q.tree.drawers.find(function(x){ return x.id===did; }); const it=d.items.find(function(x){ return x.id===iid; }); if(it) trashItem('tree',{drawerId:did,item:it},q.id); d.items=d.items.filter(function(x){ return x.id!==iid; }); save(); renderAll();
};
window.noteDragStart=function(ev,id){ ev.dataTransfer.setData('text/plain',id); };
window.noteDrop=function(ev,zone){ ev.preventDefault(); const id=ev.dataTransfer.getData('text/plain'); const n=S.notes.find(function(x){ return x.id===id; }); if(n){ n.zone=zone; n.updated=Date.now(); save(); renderAll(); } };

function esc(s){ return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* Trash */
function trashItem(type,data,qid){
  if(!S.trash) S.trash=[];
  const now=Date.now();
  S.trash.push({id:uid(),type:type,data:data,qid:qid||'',deletedAt:now,expiresAt:now+3*864e5});
  if(S.trash.length>200) S.trash=S.trash.slice(-200);
}
function cleanTrash(){
  if(!S.trash) return;
  const now=Date.now();
  const before=S.trash.length;
  S.trash=S.trash.filter(function(it){ return it.expiresAt>now; });
  const removed=before-S.trash.length;
  if(removed>0) console.log('Auto-cleaned '+removed+' expired trash items');
}
function restoreTrashItem(tid){
  if(!S.trash) return false;
  const idx=S.trash.findIndex(function(x){ return x.id===tid; });
  if(idx<0) return false;
  const t=S.trash[idx];
  if(t.type==='quest'){ S.quests.unshift(t.data); }
  else if(t.type==='line'){ const q=findQuest(t.qid); if(q) q.line.push(t.data); }
  else if(t.type==='tree'){ const q=findQuest(t.qid); if(q){ const d=q.tree.drawers.find(function(x){ return x.id===t.data.drawerId; }); if(d) d.items.push(t.data.item); } }
  else if(t.type==='net'){ const q=findQuest(t.qid); if(q) q.net.nodes.push(t.data); }
  else if(t.type==='parking'){ S.parking[t.data.cat].push(t.data.item); }
  S.trash.splice(idx,1);
  return true;
}
function toast(s){ const t=document.getElementById('toast'); t.textContent=s; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },2000); }

try{ load(); renderAll(); }catch(err){ document.body.innerHTML='<div style="padding:40px 24px;text-align:center;line-height:1.8"><h2>启动出错了</h2><p style="color:var(--muted)">'+esc(err&&err.message?err.message:err)+'</p><p style="margin-top:20px"><button class="btn pri" onclick="location.reload()">刷新试试</button></p><p style="margin-top:20px;font-size:13px;color:var(--muted)">如果反复出现，请换用手机自带浏览器打开，或清除缓存。</p></div>'; }
